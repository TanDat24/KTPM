version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cms-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped